[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sditt"
version = "0.1.0"
description = "Python migration scaffold and data readers for SDITT."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
test = [
  "pytest>=7",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["sditt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
